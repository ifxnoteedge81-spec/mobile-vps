name: Build KaryoOS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/KaryoOS-Agent.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KaryoOSAgent-APKs
          path: |
            android-app/app/build/outputs/apk/KaryoOS-Agent.apk
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KaryoOS Agent v1.0.${{ github.run_number }}
          files: |
            android-app/app/build/outputs/apk/KaryoOS-Agent.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
